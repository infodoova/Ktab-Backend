###############################################################################
# KTAB BACKEND — BASE CONFIGURATION
# Shared across ALL profiles. Profile-specific files override only what differs.
###############################################################################

# ---------------------------------------------------------------------------
# Profile & Config Import
# ---------------------------------------------------------------------------
spring.profiles.default=development
spring.profiles.active=${SPRING_PROFILES_ACTIVE:development}
spring.profiles.group.local=development
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------------------
# Application
# ---------------------------------------------------------------------------
spring.application.name=Ktab
info.app.name=${spring.application.name}
info.app.description=Ktab Backend API
info.app.version=0.0.1-SNAPSHOT

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=${PORT:8080}
server.forward-headers-strategy=native
server.tomcat.tcp-no-delay=true
server.tomcat.socket.so-keep-alive=true
server.tomcat.socket.so-timeout=20000
server.tomcat.connection-timeout=20s
server.tomcat.keep-alive-timeout=60s
spring.mvc.async.request-timeout=60000

# Error handling (overridden per-profile for prod hardening)
server.error.include-message=always
server.error.include-binding-errors=always

# ---------------------------------------------------------------------------
# Database — DataSource
# ---------------------------------------------------------------------------
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ktab}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.hikari.connection-timeout=20000

# ---------------------------------------------------------------------------
# JPA / Hibernate (shared tuning; ddl-auto & show-sql differ per profile)
# ---------------------------------------------------------------------------
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---------------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.schemas=public

# ---------------------------------------------------------------------------
# Spring Batch
# ---------------------------------------------------------------------------
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# ---------------------------------------------------------------------------
# Zoho ZeptoMail (Transactional SMTP — credentials loaded from env)
# ---------------------------------------------------------------------------
spring.mail.host=${ZEPTOMAIL_HOST:smtp.zeptomail.com}
spring.mail.port=${ZEPTOMAIL_PORT:587}
spring.mail.username=${ZEPTOMAIL_USERNAME:emailapikey}
spring.mail.password=${ZEPTOMAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Ktab ZeptoMail Properties
ktab.mail.zepto.enabled=${ZEPTOMAIL_ENABLED:true}
ktab.mail.zepto.host=${ZEPTOMAIL_HOST:smtp.zeptomail.com}
ktab.mail.zepto.port=${ZEPTOMAIL_PORT:587}
ktab.mail.zepto.username=${ZEPTOMAIL_USERNAME:emailapikey}
ktab.mail.zepto.password=${ZEPTOMAIL_PASSWORD:}
ktab.mail.zepto.from-email=${ZEPTOMAIL_FROM_EMAIL:noreply@ktab.app}
ktab.mail.zepto.from-name=${ZEPTOMAIL_FROM_NAME:Ktab}
ktab.mail.zepto.async-core-pool-size=4
ktab.mail.zepto.async-max-pool-size=16
ktab.mail.zepto.async-queue-capacity=250

# Frontend Base URL (used in email action links)
ktab.app.frontend-url=${FRONTEND_URL:https://ktab-rho.vercel.app}

# ---------------------------------------------------------------------------
# Thymeleaf (Email Templates)
# ---------------------------------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/emails/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# ---------------------------------------------------------------------------
# File Upload
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ---------------------------------------------------------------------------
# Internationalization
# ---------------------------------------------------------------------------
spring.messages.encoding=UTF-8

# ---------------------------------------------------------------------------
# JMX
# ---------------------------------------------------------------------------
spring.jmx.enabled=false

# ---------------------------------------------------------------------------
# Swagger / SpringDoc
# ---------------------------------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.url=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ---------------------------------------------------------------------------
# Actuator & Metrics
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.prometheus.enabled=true
management.health.mail.enabled=false
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=ktab
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
management.info.build.enabled=true

# ---------------------------------------------------------------------------
# Rate Limiting (Bucket4j)
# ---------------------------------------------------------------------------
app.rate-limiting.enabled=true
# Auth endpoints (login, register, password reset, OAuth)
app.rate-limiting.auth.capacity=10
app.rate-limiting.auth.refill-tokens=10
app.rate-limiting.auth.refill-duration-seconds=60
# AI endpoints (LLM, TTS, story generation)
app.rate-limiting.ai.capacity=20
app.rate-limiting.ai.refill-tokens=20
app.rate-limiting.ai.refill-duration-seconds=60
# General REST API
app.rate-limiting.general.capacity=100
app.rate-limiting.general.refill-tokens=100
app.rate-limiting.general.refill-duration-seconds=60

# ---------------------------------------------------------------------------
# Cloudflare R2 Storage (shared; credentials come from env)
# ---------------------------------------------------------------------------
cloudflare.r2.region=auto
cloudflare.r2.url-strategy=SIGNED
cloudflare.r2.pdfPrefix=books
cloudflare.r2.pagesPrefix=books
cloudflare.r2.deadLetterPrefix=dead-letter/books
cloudflare.r2.presigned.expiration-minutes=600
cloudflare.r2.accountId=${CF_ACCOUNT_ID:}
cloudflare.r2.accessKeyId=${CF_R2_ACCESS_KEY:}
cloudflare.r2.secretKey=${CF_R2_SECRET_KEY:}
cloudflare.r2.bucketName=${CF_R2_BUCKET_NAME:ktab-bucket}
cloudflare.r2.publicUrl=${CF_R2_PUBLIC_URL:}
# Backward-compatibility aliases
aws.s3.bucketName=${cloudflare.r2.bucketName}
aws.s3.accessKeyId=${cloudflare.r2.accessKeyId}
aws.s3.secretKey=${cloudflare.r2.secretKey}

# ---------------------------------------------------------------------------
# OCR
# ---------------------------------------------------------------------------
ktab.ocr.dpi=300
ktab.ocr.chunkSize=20
ktab.ocr.retryLimit=3
ktab.ocr.threadPoolSize=20
ktab.ocr.queueCapacity=200
ktab.ocr.decomposition.parallelism=8
ktab.ocr.presigned.expiration-minutes=30

# ---------------------------------------------------------------------------
# Circuit Breaker
# ---------------------------------------------------------------------------
ktab.circuitbreaker.failure-rate-threshold=50
ktab.circuitbreaker.slow-call-rate-threshold=80
ktab.circuitbreaker.slow-call-duration-seconds=10
ktab.circuitbreaker.wait-duration-open-seconds=30
ktab.circuitbreaker.sliding-window-size=20

# ---------------------------------------------------------------------------
# AI Quotas (Vertex concurrency gate)
# ---------------------------------------------------------------------------
ktab.quotas.maxParallelRequests=10
ktab.quotas.minParallelRequests=1

# ---------------------------------------------------------------------------
# Vertex AI Gemini (shared config; project-id from env)
# ---------------------------------------------------------------------------
spring.ai.vertex.ai.gemini.project-id=${GCP_PROJECT_ID:ktab-prod}
spring.ai.vertex.ai.gemini.location=global
spring.ai.vertex.ai.gemini.api-endpoint=aiplatform.googleapis.com
spring.ai.vertex.ai.gemini.transport=grpc
spring.ai.vertex.ai.gemini.chat.options.model=gemini-3-flash-preview
spring.ai.vertex.ai.gemini.chat.options.temperature=0.3
spring.ai.vertex.ai.gemini.chat.options.top-p=0.9
spring.ai.vertex.ai.gemini.chat.options.top-k=32
spring.ai.vertex.ai.gemini.chat.options.candidate-count=1
spring.ai.vertex.ai.gemini.chat.options.max-output-tokens=4096
spring.ai.vertex.ai.gemini.chat.options.google-search-retrieval=false
spring.ai.retry.max-attempts=5
spring.ai.retry.initial-interval=2000
spring.ai.retry.multiplier=3

# ---------------------------------------------------------------------------
# Vertex AI Imagen (shared)
# ---------------------------------------------------------------------------
spring.ai.vertex.ai.imagen.project-id=${GCP_PROJECT_ID:ktab-prod}
spring.ai.vertex.ai.imagen.location=global
spring.ai.vertex.ai.imagen.options.model=${ktab.ai.image.primary}

# ---------------------------------------------------------------------------
# OpenAI (api-key & model differ per profile)
# ---------------------------------------------------------------------------
spring.ai.openai.api-key=${OPENAI_API_KEY:none}
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.top-p=0.9
spring.ai.openai.chat.options.max-tokens=4096

# ---------------------------------------------------------------------------
# ElevenLabs TTS (shared; api-key from env)
# ---------------------------------------------------------------------------
elevenlabs.apiKey=${ELEVENLABS_API_KEY:none}
elevenlabs.baseUrl=https://api.elevenlabs.io
elevenlabs.voiceId=${ELEVENLABS_VOICE_ID:}
elevenlabs.voiceAliases.ar-male-1=${ELEVENLABS_AR_MALE_VOICE_ID:}
elevenlabs.modelId=eleven_v3
spring.ai.elevenlabs.api-key=${ELEVENLABS_API_KEY:none}
spring.ai.elevenlabs.base-url=https://api.elevenlabs.io
spring.ai.elevenlabs.tts.options.model-id=eleven_v3
ktab.tts.rate-limit.requests-per-minute=10
ktab.tts.max-chars-per-request=50000

# ---------------------------------------------------------------------------
# Upstash QStash (shared; credentials from env)
# ---------------------------------------------------------------------------
qstash.base-url=${QSTASH_URL:https://qstash-eu-central-1.upstash.io}
qstash.token=${QSTASH_TOKEN:}
qstash.current-signing-key=${QSTASH_CURRENT_SIGNING_KEY:}
qstash.next-signing-key=${QSTASH_NEXT_SIGNING_KEY:}
qstash.ocr.callback-url=${APP_BASE_URL:http://localhost:8080}/api/v1/internal/ocr/process
qstash.ocr.retries=3

# ---------------------------------------------------------------------------
# Cookie (shared names; secure & same-site differ per profile)
# ---------------------------------------------------------------------------
app.cookie.name=ACCESS_TOKEN
app.cookie.refresh-name=REFRESH_TOKEN

# ---------------------------------------------------------------------------
# CORS (override from env for all profiles)
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}

# ---------------------------------------------------------------------------
# Google OAuth2
# ---------------------------------------------------------------------------
google.oauth2.client-id=${GOOGLE_CLIENT_ID:}
google.oauth2.client-secret=${GOOGLE_CLIENT_SECRET:}

# ---------------------------------------------------------------------------
# Image Validation Properties
# ---------------------------------------------------------------------------
app.image.validation.cover-ratio=1.6
app.image.validation.cover-tolerance=0.25
app.image.validation.square-ratio=1.0
app.image.validation.square-tolerance=0.20
app.image.validation.max-file-size=5242880
app.image.validation.max-pixel-count=40000000

# ---------------------------------------------------------------------------
# ElevenLabs Studio & Digital Ingestion Pipeline
# ---------------------------------------------------------------------------
ktab.ingestion.classification.enabled=${KTAB_INGESTION_CLASSIFICATION_ENABLED:true}
ktab.ingestion.classification.shadow-mode=${KTAB_INGESTION_SHADOW_MODE:false}

ktab.studio.enabled=${KTAB_STUDIO_ENABLED:false}
ktab.ocr.enabled=${KTAB_OCR_ENABLED:false}

# Ktab-owned extraction (features.extraction) and text-to-speech (features.nativetts): used while the Studio / OCR switches are off
ktab.extraction.max-upload-bytes=${KTAB_EXTRACTION_MAX_UPLOAD_BYTES:209715200}
ktab.native-tts.api-key=${ELEVENLABS_API_KEY:}
ktab.native-tts.base-url=${ELEVENLABS_BASE_URL:https://api.elevenlabs.io}
# No default narrator: the owner chooses one. The audiobook job refuses to start while this is blank.
ktab.native-tts.voice-id=${KTAB_NATIVE_TTS_VOICE_ID:}
ktab.native-tts.model-id=${KTAB_NATIVE_TTS_MODEL_ID:eleven_multilingual_v2}
ktab.native-tts.max-chars-per-request=${KTAB_NATIVE_TTS_MAX_CHARS:2500}
ktab.native-tts.send-context=${KTAB_NATIVE_TTS_SEND_CONTEXT:true}
ktab.native-tts.max-chars-per-book=${KTAB_NATIVE_TTS_MAX_CHARS_PER_BOOK:1500000}
ktab.studio.api-key=${ELEVENLABS_API_KEY:}
ktab.studio.base-url=${ELEVENLABS_BASE_URL:https://api.elevenlabs.io}
ktab.studio.default-model-id=${ELEVENLABS_STUDIO_MODEL_ID:eleven_v2_multilingual}
ktab.studio.quality-preset=${ELEVENLABS_STUDIO_QUALITY_PRESET:high}
ktab.studio.default-title-voice-id=${ELEVENLABS_STUDIO_TITLE_VOICE_ID:21m00Tcm4TlvDq8ikWAM}
ktab.studio.default-paragraph-voice-id=${ELEVENLABS_STUDIO_PARAGRAPH_VOICE_ID:21m00Tcm4TlvDq8ikWAM}
ktab.studio.page-target-chars=${ELEVENLABS_STUDIO_PAGE_TARGET_CHARS:1800}

# General ElevenLabs TTS settings fallback
elevenlabs.api-key=${ELEVENLABS_API_KEY:}
elevenlabs.base-url=${ELEVENLABS_BASE_URL:https://api.elevenlabs.io}
elevenlabs.voice-id=${ELEVENLABS_STUDIO_PARAGRAPH_VOICE_ID:21m00Tcm4TlvDq8ikWAM}

# ===== Personalized storybook (docs/superpowers/plans/2026-09-24-storybook-00-overview.md) =====
ktab.storybook.enabled=${KTAB_STORYBOOK_ENABLED:false}

# LLM – text/critic/qa model
ktab.storybook.llm.model=${KTAB_STORYBOOK_LLM_MODEL:gpt-6-luna}
ktab.storybook.llm.api-key=${OPENAI_API_KEY:}
ktab.storybook.llm.provider=${KTAB_STORYBOOK_LLM_PROVIDER:OPENAI}

# Image – the models come from the global AI configuration at the end of this file (change one line there)
ktab.storybook.image.primary-model=${KTAB_STORYBOOK_IMAGE_PRIMARY:${ktab.ai.image.primary}}
# The storybook escalates a failed picture to the stronger Pro model, so its fallback is not the app-wide cheap one.
ktab.storybook.image.fallback-model=${KTAB_STORYBOOK_IMAGE_FALLBACK:gemini-3-pro-image}
ktab.storybook.image.aspect-ratio=${KTAB_STORYBOOK_IMAGE_ASPECT_RATIO:3:4}
ktab.storybook.image.image-size=${KTAB_STORYBOOK_IMAGE_SIZE:${ktab.ai.image.image-size}}
ktab.storybook.image.primary-generations=${KTAB_STORYBOOK_IMAGE_PRIMARY_GENS:2}
ktab.storybook.image.max-generations=${KTAB_STORYBOOK_IMAGE_MAX_GENS:4}

# Pricing per-image (USD) – both GA and -preview aliases so ledger never throws
ktab.storybook.pricing.image-per-image-usd[gemini-3.1-flash-image]=0.067
ktab.storybook.pricing.image-per-image-usd[gemini-3.1-flash-image-preview]=0.067
ktab.storybook.pricing.image-per-image-usd[gemini-3-pro-image]=0.134
ktab.storybook.pricing.image-per-image-usd[gemini-3.1-flash-lite-image]=0.050
ktab.storybook.pricing.image-per-image-usd[gemini-3-pro-image-preview]=0.134

# Pricing per-million-tokens (USD)
ktab.storybook.pricing.llm[gpt-6-luna].input-per-million-usd=0.10
ktab.storybook.pricing.llm[gpt-6-luna].output-per-million-usd=0.50
ktab.storybook.pricing.llm[claude-sonnet-5].input-per-million-usd=2.00
ktab.storybook.pricing.llm[claude-sonnet-5].output-per-million-usd=10.00

# Worker & limits
ktab.storybook.worker.concurrency=${KTAB_STORYBOOK_WORKER_CONCURRENCY:4}
ktab.storybook.worker.poll-delay=${KTAB_STORYBOOK_WORKER_POLL_DELAY:2s}
ktab.storybook.limits.max-book-cost-usd=${KTAB_STORYBOOK_MAX_BOOK_COST_USD:3.00}
ktab.storybook.limits.drafts-per-user-per-day=${KTAB_STORYBOOK_DRAFTS_PER_DAY:3}
ktab.storybook.credits.required=${KTAB_STORYBOOK_CREDITS_REQUIRED:true}
ktab.storybook.credits.units-per-book=${KTAB_STORYBOOK_CREDITS_PER_BOOK:1}

# Photo upload encryption key (AES-256 base64). NEVER commit a real value.
ktab.storybook.photo.encryption-key=${KTAB_STORYBOOK_PHOTO_KEY:}

# ---------------------------------------------------------------------------
# Talk to Book (Isolated AI reading assistant configuration)
# ---------------------------------------------------------------------------
ktab.talk-to-book.model=${KTAB_TALK_TO_BOOK_MODEL:${ktab.ai.text.primary}}
ktab.talk-to-book.reasoning-effort=${KTAB_TALK_TO_BOOK_REASONING_EFFORT:none}
ktab.talk-to-book.temperature=${KTAB_TALK_TO_BOOK_TEMPERATURE:1.0}
ktab.talk-to-book.max-output-tokens=${KTAB_TALK_TO_BOOK_MAX_OUTPUT_TOKENS:6000}
ktab.talk-to-book.max-input-tokens=120
ktab.talk-to-book.embedding-model=${KTAB_TALK_TO_BOOK_EMBEDDING_MODEL:${ktab.ai.text.embedding}}
ktab.talk-to-book.similarity-threshold=${KTAB_TALK_TO_BOOK_SIMILARITY_THRESHOLD:0.82}
ktab.talk-to-book.max-records-per-book=500
ktab.talk-to-book.eviction-batch-size=50
ktab.talk-to-book.web-search-enabled=true

# Bump when Talk to Book prompts, retrieval or answer rules change.
ktab.talk-to-book.answer-version=${KTAB_TALK_TO_BOOK_ANSWER_VERSION:1}

# ===== Book trailers (Claude Managed Agents trailer agent) =====
ktab.trailer.enabled=${KTAB_TRAILER_ENABLED:false}
ktab.trailer.anthropic-api-key=${ANTHROPIC_API_KEY:}
ktab.trailer.webhook-signing-key=${ANTHROPIC_WEBHOOK_SIGNING_KEY:}
ktab.trailer.agent-id=${KTAB_TRAILER_AGENT_ID:}
ktab.trailer.agent-version=${KTAB_TRAILER_AGENT_VERSION:20}
ktab.trailer.environment-id=${KTAB_TRAILER_ENVIRONMENT_ID:}
ktab.trailer.vault-id=${KTAB_TRAILER_VAULT_ID:}
ktab.trailer.workspace=${KTAB_TRAILER_WORKSPACE:default}
ktab.trailer.voices=${KTAB_TRAILER_VOICES:}
ktab.trailer.budget-cents=${KTAB_TRAILER_BUDGET_CENTS:2000}
ktab.trailer.max-outcome-iterations=${KTAB_TRAILER_MAX_OUTCOME_ITERATIONS:3}
ktab.trailer.soft-higgsfield-generations=${KTAB_TRAILER_SOFT_HIGGSFIELD_GENERATIONS:14}
ktab.trailer.max-higgsfield-generations=${KTAB_TRAILER_MAX_HIGGSFIELD_GENERATIONS:16}
ktab.trailer.max-video-jobs=${KTAB_TRAILER_MAX_VIDEO_JOBS:3}
ktab.trailer.max-higgsfield-calls=${KTAB_TRAILER_MAX_HIGGSFIELD_CALLS:40}
ktab.trailer.auto-promote-valid-media-without-qc=${KTAB_TRAILER_AUTO_PROMOTE_VALID_MEDIA_WITHOUT_QC:true}
ktab.trailer.higgsfield-generation-marker=${KTAB_TRAILER_HIGGSFIELD_GENERATION_MARKER:generate}
ktab.trailer.higgsfield-job-pattern=${KTAB_TRAILER_HIGGSFIELD_JOB_PATTERN:(?s)(?=.*"results")(?=.*"status"\\s*:\\s*"pending")}
ktab.trailer.higgsfield-generate-args=${KTAB_TRAILER_HIGGSFIELD_GENERATE_ARGS:model=seedance_2_5, mode=t2v, aspect_ratio=16:9, resolution=1080p, duration=30, generate_audio=false}
ktab.trailer.higgsfield-max-in-flight=${KTAB_TRAILER_HIGGSFIELD_MAX_IN_FLIGHT:2}
ktab.trailer.higgsfield-mcp-url=${KTAB_TRAILER_HIGGSFIELD_MCP_URL:https://mcp.higgsfield.ai/mcp}
ktab.trailer.higgsfield-callback-url=${KTAB_TRAILER_CALLBACK_URL:${KTAB_PUBLIC_BASE_URL:${APP_BASE_URL:http://localhost:8080}}/api/v1/public/trailer-agent/higgsfield/callback}
ktab.trailer.per-book-per30-days=${KTAB_TRAILER_PER_BOOK_PER_30_DAYS:3}
ktab.trailer.ffprobe-path=${KTAB_TRAILER_FFPROBE_PATH:ffprobe}
ktab.trailer.worker-tick=${KTAB_TRAILER_WORKER_TICK:15s}
ktab.trailer.reconcile-every=${KTAB_TRAILER_RECONCILE_EVERY:60s}
ktab.trailer.launch-timeout=${KTAB_TRAILER_LAUNCH_TIMEOUT:5m}
ktab.trailer.max-session-age=${KTAB_TRAILER_MAX_SESSION_AGE:2h}
ktab.trailer.max-concurrent-runs=${KTAB_TRAILER_MAX_CONCURRENT_RUNS:4}

# ---------------------------------------------------------------------------
# In-Book AI Image Generation
# ---------------------------------------------------------------------------
ktab.imagegen.ai-model=${KTAB_IMAGEGEN_AI_MODEL:${ktab.ai.image.primary}}
ktab.imagegen.search-model=${KTAB_IMAGEGEN_SEARCH_MODEL:${ktab.ai.text.search}}
ktab.imagegen.image-size=${KTAB_IMAGEGEN_IMAGE_SIZE:${ktab.ai.image.image-size}}

# ===========================================================================
# Global AI Model Configuration — change ONE line to update the whole app
# ===========================================================================
# Text / LLM (OpenAI)
ktab.ai.text.primary=${KTAB_AI_TEXT_PRIMARY:gpt-6-luna}
ktab.ai.text.fallback=${KTAB_AI_TEXT_FALLBACK:gpt-4o}
ktab.ai.text.embedding=${KTAB_AI_TEXT_EMBEDDING:text-embedding-3-small}
ktab.ai.text.search=${KTAB_AI_TEXT_SEARCH:gemini-2.5-flash}
ktab.ai.text.reasoning-effort=${KTAB_AI_TEXT_REASONING_EFFORT:low}
ktab.ai.text.service-tier=${KTAB_AI_TEXT_SERVICE_TIER:fast}
# Image (Gemini on Vertex AI)
ktab.ai.image.primary=${KTAB_AI_IMAGE_PRIMARY:gemini-3.1-flash-image}
ktab.ai.image.fallback=${KTAB_AI_IMAGE_FALLBACK:gemini-3.1-flash-lite-image}
ktab.ai.image.image-size=${KTAB_AI_IMAGE_SIZE:1K}
