###############################################################################
# KTAB BACKEND - BASE CONFIGURATION (application.properties)
###############################################################################

# --- Profile Configuration ---
# Defaults to 'development' if not specified in environment
spring.profiles.active=${SPRING_PROFILES_ACTIVE:development}
spring.profiles.group.local=development

# --- Application Name ---
spring.application.name=Ktab

# --- Server Defaults ---
server.port=${PORT:8080}
server.forward-headers-strategy=native
server.tomcat.connection-timeout=20s
server.tomcat.keep-alive-timeout=60s
spring.mvc.async.request-timeout=60000

# --- Spring Batch Defaults ---
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# --- Internationalization ---
spring.messages.encoding=UTF-8

# --- File Upload Limits ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- Swagger / SpringDoc ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.url=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# --- JMX ---
spring.jmx.enabled=false

# --- Actuator Info Endpoint Configuration ---
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
management.info.build.enabled=true

info.app.name=${spring.application.name}
info.app.description=Ktab
info.app.version=0.0.1-SNAPSHOT

# --- Token-Bucket Rate Limiting (Bucket4j) ---
app.rate-limiting.enabled=true

# Auth Tier (Login, Register, Password Reset, Google OAuth)
app.rate-limiting.auth.capacity=10
app.rate-limiting.auth.refill-tokens=10
app.rate-limiting.auth.refill-duration-seconds=60

# AI Tier (LLM Completions, Story Generation, TTS)
app.rate-limiting.ai.capacity=20
app.rate-limiting.ai.refill-tokens=20
app.rate-limiting.ai.refill-duration-seconds=60

# General API Tier (Standard REST APIs)
app.rate-limiting.general.capacity=100
app.rate-limiting.general.refill-tokens=100
app.rate-limiting.general.refill-duration-seconds=60