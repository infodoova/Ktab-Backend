#################################
# Application (Production)
#################################
spring.application.name=Ktab
server.forward-headers-strategy=native
# DO NOT set spring.profiles.active here
# It must come from environment (Tomcat / systemd)

#################################
# DataSource & Database (Production)
#################################
spring.datasource.url=jdbc:postgresql://localhost:5432/ktab
spring.datasource.username=ktab_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

#################################
# JPA & Hibernate (Production)
#################################
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

#################################
# Flyway (Database Migrations - Production)
#################################
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.schemas=public

#################################
# Server Configuration (Tomcat)
#################################
# Context path - set in Tomcat context.xml or server.xml
# server.servlet.context-path=/ktab

# Tomcat WebSocket & Connection Settings
server.tomcat.tcp-no-delay=true
server.tomcat.socket.so-keep-alive=true
server.tomcat.socket.so-timeout=20000
server.tomcat.max-connections=10000
server.tomcat.accept-count=100
server.tomcat.threads.max=200
server.tomcat.threads.min=10

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always

#################################
# Security / JWT (Production)
#################################
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=21600000

#################################
# Mail (Production)
#################################
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#################################
# Thymeleaf (Email Templates)
#################################
spring.thymeleaf.prefix=classpath:/templates/emails/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=true

#################################
# AWS S3 (Production)
#################################
aws.s3.accessKeyId=${AWS_ACCESS_KEY}
aws.s3.secretKey=${AWS_SECRET_KEY}
aws.s3.region=eu-north-1
aws.s3.bucketName=amzn-s3-ktab-bucket
aws.s3.url-strategy=SIGNED
aws.s3.presigned.expiration-minutes=600
aws.s3.pdfPrefix=books
aws.s3.pagesPrefix=books
aws.s3.deadLetterPrefix=dead-letter/books

#################################
# OCR Configuration
#################################
ktab.ocr.dpi=300
ktab.ocr.chunkSize=20
ktab.ocr.retryLimit=3
ktab.ocr.threadPoolSize=20
ktab.ocr.queueCapacity=200
ktab.ocr.decomposition.parallelism=8
ktab.ocr.presigned.expiration-minutes=30

#################################
# SQS Configuration (OCR Queue)
#################################
aws.sqs.ocr.queue-url=https://sqs.eu-north-1.amazonaws.com/079815394369/ktab-ocr-pages
aws.sqs.ocr.dead-letter-queue-url=https://sqs.eu-north-1.amazonaws.com/079815394369/ktab-ocr-pages-dlq
aws.sqs.ocr.visibility-timeout-seconds=300
aws.sqs.ocr.max-messages-per-poll=10
aws.sqs.ocr.worker-enabled=true

#################################
# Circuit Breaker Configuration
#################################
ktab.circuitbreaker.failure-rate-threshold=50
ktab.circuitbreaker.slow-call-rate-threshold=80
ktab.circuitbreaker.slow-call-duration-seconds=10
ktab.circuitbreaker.wait-duration-open-seconds=30
ktab.circuitbreaker.sliding-window-size=20

#################################
# OCR System Prompt
#################################
ktab.ocr.systemPrompt=You are an expert multilingual document archivist and TTS (Text-to-Speech) optimization specialist. Your task is to extract textual content from the provided document page image and convert it into high-fidelity, speech-ready Markdown. \
\
1. Language Handling & Audio Optimization \
Reading Order: Maintain the original reading order (Right-to-Left for Arabic, Left-to-Right for Latin). \
Arabic Diacritics (CRITICAL): \
Authorization: You are explicitly authorized to infer and apply full diacritization (Tashkeel) to all Arabic text. \
Goal: Ensure the text is phonetically unambiguous for ElevenLabs Turbo v2.5/v3 models. \
Constraint: Do not change the words themselves; only add the vowels/diacritics required for grammatically correct Standard Arabic pronunciation. \
Pacing & Breath Markers: \
Ensure all sentences end with clear punctuation (., ?, !). \
If a visual break or distinct section spacing suggests a pause, insert an ellipsis ... or a double line break to cue the TTS engine to pause. \
\
2. Extraction Rules (Strict) \
Extract: All visible body text, headers (#, ##), and lists. \
Exclude: \
Visual Noise: Page numbers, running headers/footers, watermarks, vertical marginalia. \
Non-Text Elements: Images, charts, diagrams. \
Tables: [User Choice: Convert tables to Markdown syntax OR Exclude]. (Default to Markdown tables if not specified). \
Symbol Normalization (TTS Friendly): \
Convert ambiguous symbols to spoken text only if strictly necessary for clarity (e.g., convert a solitary % to percent if the context implies speech flow, otherwise keep strict). For strict archival, prefer keeping original symbols but ensuring spacing is clean. \
\
3. Safety & Accuracy (The "Sole Source" Rule) \
Treat the image as the sole source of truth. \
Do NOT paraphrase, summarize, or hallucinate content. \
Do NOT output "OCR garbage" (random characters like ^&%#). If text is blurry/illegible, strictly output [unreadable]. \
\
4. Hard-Fail Mechanism \
Assess Legibility: Before generating, analyze if the document is readable. \
Trigger Hard Fail If: \
The text is too blurry to be read with >90% certainty. \
The reading order is fundamentally ambiguous. \
The content requires significant guessing to reconstruct. \
Hard-Fail Output: \
text : \
wordscount : 0 \
\
5. Output Format \
Return the output in this exact key-value format. Do not use code blocks. \
text : <markdown_text> \
wordscount : <total_word_count>

#################################
# OCR / AI Quotas
#################################
ktab.quotas.maxParallelRequests=10
ktab.quotas.minParallelRequests=1

#################################
# OpenAI (Production)
#################################
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.top-p=0.9
spring.ai.openai.chat.options.max-tokens=4096

#################################
# Vertex AI Gemini (Production)
#################################
spring.ai.vertex.ai.gemini.project-id=ktab-prod
spring.ai.vertex.ai.gemini.location=global
spring.ai.vertex.ai.gemini.chat.options.model=gemini-3-flash-preview
spring.ai.vertex.ai.gemini.api-endpoint=aiplatform.googleapis.com
spring.ai.vertex.ai.gemini.chat.options.temperature=0.3
spring.ai.vertex.ai.gemini.chat.options.top-p=0.9
spring.ai.vertex.ai.gemini.chat.options.top-k=32
spring.ai.vertex.ai.gemini.chat.options.candidate-count=1
spring.ai.vertex.ai.gemini.chat.options.max-output-tokens=4096
spring.ai.vertex.ai.gemini.chat.options.google-search-retrieval=false
spring.ai.vertex.ai.gemini.transport=grpc
spring.ai.retry.max-attempts=5
spring.ai.retry.initial-interval=2000
spring.ai.retry.multiplier=3

#################################
# Vertex AI Imagen (Production)
#################################
spring.ai.vertex.ai.imagen.project-id=ktab-prod
spring.ai.vertex.ai.imagen.location=global
spring.ai.vertex.ai.imagen.options.model=gemini-pro-image-preview

#################################
# ElevenLabs TTS (Production)
#################################
elevenlabs.apiKey=${ELEVENLABS_API_KEY}
elevenlabs.baseUrl=https://api.elevenlabs.io
elevenlabs.modelId=eleven_v3
spring.ai.elevenlabs.api-key=${ELEVENLABS_API_KEY}
spring.ai.elevenlabs.base-url=https://api.elevenlabs.io
spring.ai.elevenlabs.tts.options.model-id=eleven_v3

#################################
# TTS Configuration
#################################
ktab.tts.rate-limit.requests-per-minute=10
ktab.tts.max-chars-per-request=50000

#################################
# Internationalization / Encoding
#################################
spring.messages.encoding=UTF-8

#################################
# File Upload Limits
#################################
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

#################################
# Swagger / SpringDoc (Production)
#################################
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.url=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

#################################
# Logging (Production)
#################################
logging.level.root=info
logging.level.org.springframework.web.servlet.resource=INFO
logging.level.org.springdoc=INFO
logging.level.com.ktab=INFO
logging.level.com.doova.ktab=INFO
logging.level.com.doova.ktab.ocr=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.web.socket=INFO

#################################
# Actuator & Metrics (Production)
#################################
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=ktab

#################################
# JMX
#################################
spring.jmx.enabled=false