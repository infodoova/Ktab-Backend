#################################
# Application (Production)
#################################
spring.application.name=Ktab
# DO NOT set spring.profiles.active here
# It must come from environment (Tomcat / systemd)

#################################
# DataSource & Database (Production)
#################################
spring.datasource.url=jdbc:postgresql://localhost:5432/ktab
spring.datasource.username=ktab_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

#################################
# JPA & Hibernate (Production)
#################################
spring.jpa.hibernate.ddl-auto=update

#################################
# Security / JWT (Production)
#################################
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=21600000

#################################
# Mail (Production)
#################################
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#################################
# AWS S3 (Production)
#################################
aws.s3.accessKeyId=${AWS_ACCESS_KEY}
aws.s3.secretKey=${AWS_SECRET_KEY}
aws.s3.region=eu-north-1
aws.s3.bucketName=amzn-s3-ktab-bucket
aws.s3.url-strategy=SIGNED
aws.s3.presigned.expiration-minutes=600

#################################
# OpenAI (Production)
#################################
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.top-p=0.9
spring.ai.openai.chat.options.max-tokens=4096

#################################
# Vertex AI Gemini (Production)
#################################
spring.ai.vertex.ai.gemini.project-id=ktab-prod
spring.ai.vertex.ai.gemini.location=us-central1
spring.ai.vertex.ai.gemini.chat.options.model=gemini-3-pro-preview
spring.ai.vertex.ai.gemini.chat.options.temperature=0.3
spring.ai.vertex.ai.gemini.chat.options.top-p=0.9
spring.ai.vertex.ai.gemini.chat.options.top-k=32
spring.ai.vertex.ai.gemini.chat.options.candidate-count=1
spring.ai.vertex.ai.gemini.chat.options.max-output-tokens=4096
spring.ai.vertex.ai.gemini.chat.options.google-search-retrieval=false
spring.ai.vertex.ai.gemini.transport=grpc

#################################
# Internationalization / Encoding
#################################
spring.messages.encoding=UTF-8

#################################
# File Upload Limits
#################################
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

#################################
# Swagger / SpringDoc
#################################
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.url=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

#################################
# Logging
#################################
logging.level.root=info
logging.level.org.springframework.web.servlet.resource=DEBUG
logging.level.org.springdoc=DEBUG
logging.level.com.ktab=DEBUG
logging.level.org.springframework=INFO
