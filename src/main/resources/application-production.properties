###############################################################################
# KTAB BACKEND - PRODUCTION PROFILE (application-production.properties)
###############################################################################

#################################
# Application & Server (Production)
#################################
spring.application.name=Ktab
server.port=${PORT:8080}
server.forward-headers-strategy=native

# Tomcat Settings
server.tomcat.tcp-no-delay=true
server.tomcat.socket.so-keep-alive=true
server.tomcat.socket.so-timeout=20000
server.tomcat.max-connections=10000
server.tomcat.accept-count=100
server.tomcat.threads.max=200
server.tomcat.threads.min=10

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always

#################################
# DataSource & Database (Production)
#################################
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ktab}?sslmode=prefer}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:ktab_user}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

#################################
# JPA & Hibernate (Production)
#################################
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

#################################
# Flyway (Database Migrations - Production)
#################################
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.schemas=public

#################################
# Spring Batch (Production)
#################################
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

#################################
# Security / JWT (Production)
#################################
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=21600000
security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

#################################
# Mail (Production)
#################################
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#################################
# Thymeleaf (Email Templates)
#################################
spring.thymeleaf.prefix=classpath:/templates/emails/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=true

#################################
# Cloudflare R2 Storage (Production)
#################################
cloudflare.r2.accountId=${CF_ACCOUNT_ID}
cloudflare.r2.accessKeyId=${CF_R2_ACCESS_KEY:${AWS_ACCESS_KEY:}}
cloudflare.r2.secretKey=${CF_R2_SECRET_KEY:${AWS_SECRET_KEY:}}
cloudflare.r2.region=auto
cloudflare.r2.bucketName=${CF_R2_BUCKET_NAME:${AWS_S3_BUCKET_NAME:ktab-bucket}}
cloudflare.r2.publicUrl=${CF_R2_PUBLIC_URL:}
cloudflare.r2.url-strategy=SIGNED
cloudflare.r2.presigned.expiration-minutes=600
cloudflare.r2.pdfPrefix=books
cloudflare.r2.pagesPrefix=books
cloudflare.r2.deadLetterPrefix=dead-letter/books

# Backward compatibility alias
aws.s3.bucketName=${cloudflare.r2.bucketName}
aws.s3.accessKeyId=${cloudflare.r2.accessKeyId}
aws.s3.secretKey=${cloudflare.r2.secretKey}

#################################
# OCR Configuration
#################################
ktab.ocr.dpi=300
ktab.ocr.chunkSize=20
ktab.ocr.retryLimit=3
ktab.ocr.threadPoolSize=20
ktab.ocr.queueCapacity=200
ktab.ocr.decomposition.parallelism=8
ktab.ocr.presigned.expiration-minutes=30

#################################
# Upstash QStash Configuration (OCR Queue - Production)
#################################
qstash.base-url=${QSTASH_URL:https://qstash-eu-central-1.upstash.io}
qstash.token=${QSTASH_TOKEN}
qstash.current-signing-key=${QSTASH_CURRENT_SIGNING_KEY}
qstash.next-signing-key=${QSTASH_NEXT_SIGNING_KEY:}
qstash.ocr.callback-url=${APP_BASE_URL:http://localhost:8080}/api/v1/internal/ocr/process
qstash.ocr.retries=3
qstash.ocr.worker-enabled=${QSTASH_OCR_WORKER_ENABLED:${AWS_SQS_OCR_WORKER_ENABLED:true}}
qstash.verify-signature=${QSTASH_VERIFY_SIGNATURE:true}

#################################
# Circuit Breaker Configuration
#################################
ktab.circuitbreaker.failure-rate-threshold=50
ktab.circuitbreaker.slow-call-rate-threshold=80
ktab.circuitbreaker.slow-call-duration-seconds=10
ktab.circuitbreaker.wait-duration-open-seconds=30
ktab.circuitbreaker.sliding-window-size=20


#################################
# OCR / AI Quotas
#################################
ktab.quotas.maxParallelRequests=10
ktab.quotas.minParallelRequests=1

#################################
# OpenAI (Spring AI - Production)
#################################
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.top-p=0.9
spring.ai.openai.chat.options.max-tokens=4096

#################################
# Vertex AI Gemini (Spring AI - Production)
#################################
spring.ai.vertex.ai.gemini.project-id=${GCP_PROJECT_ID:ktab-prod}
spring.ai.vertex.ai.gemini.location=global
spring.ai.vertex.ai.gemini.chat.options.model=gemini-3-flash-preview
spring.ai.vertex.ai.gemini.api-endpoint=aiplatform.googleapis.com
spring.ai.vertex.ai.gemini.chat.options.temperature=0.3
spring.ai.vertex.ai.gemini.chat.options.top-p=0.9
spring.ai.vertex.ai.gemini.chat.options.top-k=32
spring.ai.vertex.ai.gemini.chat.options.candidate-count=1
spring.ai.vertex.ai.gemini.chat.options.max-output-tokens=4096
spring.ai.vertex.ai.gemini.chat.options.google-search-retrieval=false
spring.ai.vertex.ai.gemini.transport=grpc
spring.ai.retry.max-attempts=5
spring.ai.retry.initial-interval=2000
spring.ai.retry.multiplier=3

#################################
# Vertex AI Imagen (Production)
#################################
spring.ai.vertex.ai.imagen.project-id=${GCP_PROJECT_ID:ktab-prod}
spring.ai.vertex.ai.imagen.location=global
spring.ai.vertex.ai.imagen.options.model=gemini-pro-image-preview

#################################
# ElevenLabs TTS (Production)
#################################
elevenlabs.apiKey=${ELEVENLABS_API_KEY}
elevenlabs.baseUrl=https://api.elevenlabs.io
elevenlabs.modelId=eleven_v3
spring.ai.elevenlabs.api-key=${ELEVENLABS_API_KEY}
spring.ai.elevenlabs.base-url=https://api.elevenlabs.io
spring.ai.elevenlabs.tts.options.model-id=eleven_v3

#################################
# TTS Configuration
#################################
ktab.tts.rate-limit.requests-per-minute=10
ktab.tts.max-chars-per-request=50000

#################################
# Internationalization / Encoding
#################################
spring.messages.encoding=UTF-8

#################################
# File Upload Limits
#################################
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

#################################
# Swagger / SpringDoc (Production)
#################################
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.url=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

#################################
# Logging (Production)
#################################
logging.level.root=info
logging.level.org.springframework.web.servlet.resource=INFO
logging.level.org.springdoc=INFO
logging.level.com.ktab=INFO
logging.level.com.doova.ktab=INFO
logging.level.com.doova.ktab.features.ocr=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.web.socket=INFO

#################################
# Actuator & Metrics (Production)
#################################
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.health.mail.enabled=false
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=ktab

#################################
# JMX
#################################
spring.jmx.enabled=false

#################################
# Security & Cookie Configuration (Production)
#################################
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://ktab-rho.vercel.app}
app.cookie.name=ACCESS_TOKEN
app.cookie.secure=true
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}
app.cookie.max-age-seconds=21600
app.cookie.refresh-name=REFRESH_TOKEN
app.cookie.refresh-max-age-seconds=${COOKIE_REFRESH_MAX_AGE_SECONDS:604800}
google.oauth2.client-id=${GOOGLE_CLIENT_ID:}