###############################################################################
# KTAB BACKEND — PRODUCTION PROFILE
# Only values that DIFFER from application.properties belong here.
# ALL secrets must come from environment variables — never hardcoded.
###############################################################################

# ---------------------------------------------------------------------------
# Server — high-capacity thread pool for production load
# ---------------------------------------------------------------------------
server.tomcat.max-connections=10000
server.tomcat.accept-count=100
server.tomcat.threads.max=200
server.tomcat.threads.min=10

# ---------------------------------------------------------------------------
# Database — HikariCP (tuned pool for production)
# ---------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# Security / JWT  (no fallback defaults — must be set in env)
# ---------------------------------------------------------------------------
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:10800000}
security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:86400000}

# ---------------------------------------------------------------------------
# Thymeleaf — enable caching in production
# ---------------------------------------------------------------------------
spring.thymeleaf.cache=true

# ---------------------------------------------------------------------------
# OpenAI — use full production model
# ---------------------------------------------------------------------------
spring.ai.openai.chat.options.model=${ktab.ai.text.primary}

# ---------------------------------------------------------------------------
# Upstash QStash — worker enabled; verify signatures
# ---------------------------------------------------------------------------
qstash.ocr.worker-enabled=${QSTASH_OCR_WORKER_ENABLED:true}
qstash.verify-signature=${QSTASH_VERIFY_SIGNATURE:true}

# ---------------------------------------------------------------------------
# Cookie — always HTTPS in production
# ---------------------------------------------------------------------------
app.cookie.secure=true
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# ---------------------------------------------------------------------------
# Logging — minimal noise in production
# ---------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.doova.ktab=INFO
logging.level.com.doova.ktab.features.ocr=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.web.socket=INFO
