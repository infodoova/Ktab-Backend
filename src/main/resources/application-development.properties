###############################################################################
# KTAB BACKEND - DEVELOPMENT PROFILE (application-development.properties)
###############################################################################

#################################
# Application & Server
#################################
spring.application.name=Ktab
server.port=${PORT:8080}
server.forward-headers-strategy=native

# Tomcat Settings
server.tomcat.tcp-no-delay=true
server.tomcat.socket.so-keep-alive=true
server.tomcat.socket.so-timeout=20000
server.tomcat.max-connections=1000
server.tomcat.accept-count=50
server.tomcat.threads.max=50
server.tomcat.threads.min=5

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always

#################################
# DataSource & Database (Development)
#################################
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ktab}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:123456}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

#################################
# JPA & Hibernate (Development)
#################################
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

#################################
# Flyway (Database Migrations)
#################################
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.schemas=public

#################################
# Spring Batch
#################################
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

#################################
# Security / JWT (Development)
#################################
security.jwt.secret=${JWT_SECRET:p0Ruw9K3R7D0rWq2y8xSfF4uP1wM4nZ9rE6uVq0rH3I=}
security.jwt.expiration-ms=21600000
security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

#################################
