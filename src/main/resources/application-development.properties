ktab.tts.max-chars-per-request=50000

#################################
# Internationalization / Encoding
#################################
spring.messages.encoding=UTF-8

#################################
# File Upload Limits
#################################
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

#################################
# Swagger / SpringDoc (Development)
#################################
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.url=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

#################################
# Logging (Development)
#################################
logging.level.root=info
logging.level.org.springframework.web.servlet.resource=DEBUG
logging.level.org.springdoc=DEBUG
logging.level.com.ktab=DEBUG
logging.level.com.doova.ktab=DEBUG
logging.level.com.doova.ktab.features.ocr=INFO
logging.level.org.springframework=INFO

#################################
# Actuator & Metrics (Development)
#################################
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.health.mail.enabled=false
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=ktab

#################################
# JMX
#################################
spring.jmx.enabled=false

#################################
# Security & Cookie Configuration (Development)
#################################
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}
app.cookie.name=ACCESS_TOKEN
app.cookie.secure=false
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}
app.cookie.max-age-seconds=21600
app.cookie.refresh-name=REFRESH_TOKEN
app.cookie.refresh-max-age-seconds=${COOKIE_REFRESH_MAX_AGE_SECONDS:604800}
google.oauth2.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
