###############################################################################
# KTAB BACKEND — DEVELOPMENT PROFILE
# Only values that DIFFER from application.properties belong here.
###############################################################################

# ---------------------------------------------------------------------------
# Server — relaxed thread pool for dev workstation
# ---------------------------------------------------------------------------
server.tomcat.max-connections=1000
server.tomcat.accept-count=50
server.tomcat.threads.max=50
server.tomcat.threads.min=5

# Show full error details locally
server.error.include-message=always
server.error.include-binding-errors=always

# ---------------------------------------------------------------------------
# Database — HikariCP (smaller pool for dev)
# ---------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# ---------------------------------------------------------------------------
# Security / JWT
# ---------------------------------------------------------------------------
security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:60000}
security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:900000}

# ---------------------------------------------------------------------------
# Thymeleaf — disable caching for hot-reload
# ---------------------------------------------------------------------------
spring.thymeleaf.cache=false

# ---------------------------------------------------------------------------
# OpenAI — use cheaper/faster dev model
# ---------------------------------------------------------------------------
spring.ai.openai.chat.options.model=gpt-5.2

# ---------------------------------------------------------------------------
# Upstash QStash — worker off locally; use Spring Batch engine directly
# ---------------------------------------------------------------------------
qstash.ocr.worker-enabled=${QSTASH_OCR_WORKER_ENABLED:false}
qstash.verify-signature=${QSTASH_VERIFY_SIGNATURE:false}

# ---------------------------------------------------------------------------
# Cookie — dev uses env-driven secure flag (true for ngrok, false for localhost)
# ---------------------------------------------------------------------------
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# ---------------------------------------------------------------------------
# Logging — verbose for debugging
# ---------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.doova.ktab=DEBUG
logging.level.com.doova.ktab.features.ocr=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.web.servlet.resource=DEBUG
logging.level.org.springframework.boot.autoconfigure.logging.ConditionEvaluationDeltaLoggingListener=WARN
 
# ---------------------------------------------------------------------------
# Image Content Generator — dev workstation limits
# ---------------------------------------------------------------------------
ktab.imagegen.rate-limit-per-hour=1000
ktab.imagegen.max-concurrent-per-user=20
