server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Maximum file upload size (PDFs, book covers, audio files)
    client_max_body_size 100M;

    # Certbot challenge directory for future SSL certificates
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Reverse proxy to Spring Boot Application
    location / {
        proxy_pass http://ktab-app:8080;
        proxy_http_version 1.1;

        # Header forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (if needed in the future)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for AI generation, OCR processing, and large file uploads
        proxy_connect_timeout 90s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Optional: Quick health check endpoint directly through nginx
    location /health {
        access_log off;
        return 200 "nginx-ok\n";
        add_header Content-Type text/plain;
    }
}
